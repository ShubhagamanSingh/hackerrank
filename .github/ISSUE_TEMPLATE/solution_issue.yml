name: Solution issue
description: Report an incorrect solution, broken link, or repository problem.
title: "[Issue] "
body:
  - type: input
    id: challenge
    attributes:
      label: Challenge link
      description: Link to the HackerRank challenge or the file in this repository.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: Include the input, expected result, and actual result when relevant.
    validations:
      required: true
