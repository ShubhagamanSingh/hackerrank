name: Suggest a challenge
description: Suggest a HackerRank challenge for a future solution.
title: "[Challenge] "
body:
  - type: input
    id: challenge
    attributes:
      label: Official HackerRank URL
      placeholder: https://www.hackerrank.com/challenges/example/problem
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Preferred language
      description: Optional.
